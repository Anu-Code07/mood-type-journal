<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoodType Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        color: #eef2ff;
        background: linear-gradient(145deg, #090d18, #0f1a35, #153f58);
      }
      article {
        max-width: 420px;
        width: calc(100% - 32px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.1);
        padding: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        color: #d8e1ff;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>MoodType is offline</h1>
      <p>Your saved timeline remains available. Reconnect to refresh online fonts and latest app updates.</p>
    </article>
  </body>
</html>
